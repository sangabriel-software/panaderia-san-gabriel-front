<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />

    <!-- Color inicial del navegador / barra de estado -->
    <meta name="theme-color" content="#020617" />

    <meta
      name="description"
      content="San Gabriel App — Sistema de administración"
    />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="San Gabriel App"
    />

    <!-- Iconos -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />

    <link
      rel="shortcut icon"
      href="/icons/favicon.ico"
    />

    <title>San Gabriel App</title>

    <style>
      /*
       * ================================================================
       * SPLASH / LOADING
       * ================================================================
       *
       * Esta pantalla aparece antes de que React/JS termine de cargar.
       *
       * Importante:
       * - No depende de Tailwind.
       * - No depende de React.
       * - No depende de main.js.
       *
       * Esto evita un flash blanco mientras carga la aplicación.
       */

      .app-loading {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #020617;

        z-index: 9999;

        overflow: hidden;
      }

      /*
       * Cuadrícula tecnológica.
       *
       * Usa tu color BRAND:
       * #06B6D4
       */
      .app-loading::before {
        content: '';

        position: absolute;
        inset: 0;

        opacity: 0.055;

        background-image:
          linear-gradient(
            rgba(6, 182, 212, 0.8) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(6, 182, 212, 0.8) 1px,
            transparent 1px
          );

        background-size: 48px 48px;
      }

      /*
       * Glow central.
       *
       * Usa brand cyan + accent blue.
       */
      .app-loading::after {
        content: '';

        position: absolute;

        width: 220px;
        height: 220px;

        border-radius: 9999px;

        background:
          radial-gradient(
            circle,
            rgba(6, 182, 212, 0.12) 0%,
            rgba(59, 130, 246, 0.06) 35%,
            transparent 70%
          );

        filter: blur(10px);

        pointer-events: none;
      }

      /*
       * Contenedor del logo.
       */
      .app-loading__logo {
        position: relative;

        z-index: 1;

        width: 76px;
        height: 76px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 20px;

        /*
         * Fondo acorde al sistema oscuro.
         */
        background: #020617;

        /*
         * Borde cyan muy sutil.
         */
        border: 1px solid rgba(6, 182, 212, 0.25);

        /*
         * Glow cyan.
         */
        box-shadow:
          0 0 0 0 rgba(6, 182, 212, 0.35),
          0 0 30px rgba(6, 182, 212, 0.12);

        animation: app-loading-brand-glow 2.4s ease-in-out infinite;
      }

      /*
       * Tu logo.
       */
      .app-loading__logo img {
        width: 64px;
        height: 64px;

        display: block;

        object-fit: contain;
      }

      /*
       * Animación equivalente a tu brand-glow
       * de Tailwind.
       */
      @keyframes app-loading-brand-glow {
        0%,
        100% {
          box-shadow:
            0 0 0 0 rgba(6, 182, 212, 0.35),
            0 0 30px rgba(6, 182, 212, 0.10);
        }

        50% {
          box-shadow:
            0 0 0 9px rgba(6, 182, 212, 0),
            0 0 38px rgba(6, 182, 212, 0.18);
        }
      }

      /*
       * Respeta usuarios que prefieren reducir animaciones.
       */
      @media (prefers-reduced-motion: reduce) {
        .app-loading__logo {
          animation: none;
        }
      }
    </style>

    <script>
      /*
       * ================================================================
       * TEMA INICIAL
       * ================================================================
       *
       * Se ejecuta ANTES de que cargue main.js.
       *
       * Esto evita:
       *
       *   pantalla oscura
       *        ↓
       *   pantalla blanca
       *        ↓
       *   aplicación oscura
       *
       * o cualquier otro parpadeo de tema.
       */

      (function () {
        try {
          var storedTheme = localStorage.getItem('theme');

          /*
           * Tu aplicación usa darkMode: 'class'.
           *
           * Por defecto:
           * DARK
           */
          var isDark = storedTheme
            ? storedTheme === 'dark'
            : true;

          document.documentElement.classList.toggle(
            'dark',
            isDark
          );
        } catch (error) {
          /*
           * Si localStorage no está disponible,
           * utilizamos oscuro como fallback.
           */
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body class="bg-bg text-ink antialiased overscroll-none">

    <div id="root">

      <!--
        Loading estático.

        React reemplazará este contenido cuando main.js
        monte la aplicación.
      -->
      <div
        class="app-loading"
        aria-hidden="true"
      >
        <div class="app-loading__logo">
          <img
            src="/sg-mark.svg"
            alt=""
            width="64"
            height="64"
          />
        </div>
      </div>

    </div>

    <!--
      Aplicación JavaScript
    -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
